name: Build VPK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VITASDK: /home/runner/vitasdk
    steps:
      - uses: actions/checkout@v4
      - name: Cache VitaSDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: /home/runner/vitasdk
          key: vitasdk-v4
      - name: Install VitaSDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: bash ci/install-sdk.sh 2>&1 | tee -a ci-log.txt; exit ${PIPESTATUS[0]}
      - name: Build
        run: bash ci/build.sh 2>&1 | tee -a ci-log.txt; exit ${PIPESTATUS[0]}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/* --title "Build ${{ github.run_number }}" --notes-file out/NOTES.md --target "$GITHUB_SHA"
      - name: Push log and output to ci branch
        if: always()
        run: |
          git config user.name "ci"; git config user.email "actions@github.com"
          mkdir -p /tmp/ci && cp ci-log.txt /tmp/ci/ 2>/dev/null || echo "no log" > /tmp/ci/ci-log.txt
          cp out/* /tmp/ci/ 2>/dev/null || true
          git switch --orphan "ci-${{ github.run_number }}"
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/ci/* .
          find . -type f -size +95M -exec sh -c 'split -b 90m "$1" "$1.part-" && rm "$1"' _ {} \;
          git add -A && git commit -qm "CI output for run ${{ github.run_number }}" && git push -q -f origin "ci-${{ github.run_number }}"
